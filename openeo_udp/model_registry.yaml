active_model:
  # Human-readable model identifier
  name: r101_focal_dice_zscore_v2

  # Source experiment directory (for provenance tracking)
  experiment: exp_stage1_r101_focal_dice_zscore_v2

  # Download URLs — GitHub Release v2.0.0
  weights_url: https://github.com/ray-climate/solar_openEO/releases/download/v2.0.0/best.weights.h5
  band_stats_url: https://github.com/ray-climate/solar_openEO/releases/download/v2.0.0/band_stats.npz

  # ONNX + dependency archive — populated after running export_onnx.py --package
  # and uploading openeo_dependencgit ies.zip to the v2.0.0 release:
  #   python openeo_udp/export/export_onnx.py \
  #       --output openeo_udp/export/releases/v2.0.0/solar_pv.onnx \
  #       --validate --package
  #   gh release upload v2.0.0 openeo_udp/export/releases/v2.0.0/openeo_dependencies.zip
  model_archive_url: https://github.com/ray-climate/solar_openEO/releases/download/v2.0.0/openeo_dependencies.zip#onnx_models

  # Local fallback paths (relative to repo root, for development/testing)
  weights_local: openeo_udp/export/releases/v2.0.0/best.weights.h5
  band_stats_local: openeo_udp/export/releases/v2.0.0/band_stats.npz

  # Architecture parameters (must match the trained model exactly)
  backbone: resnet101
  decoder_filters:
  - 256
  - 128
  - 96
  - 64
  - 32
  decoder_dropout: 0.2
  attention: false
  se: false
  input_shape:
  - 256
  - 256
  - 13
  bands:
    - B1    # 0  - Coastal aerosol (60m)
    - B2    # 1  - Blue (10m)
    - B3    # 2  - Green (10m)
    - B4    # 3  - Red (10m)
    - B5    # 4  - Vegetation Red Edge 1 (20m)
    - B6    # 5  - Vegetation Red Edge 2 (20m)
    - B7    # 6  - Vegetation Red Edge 3 (20m)
    - B8    # 7  - NIR (10m)
    - B8A   # 8  - Vegetation Red Edge 4 (20m)
    - B9    # 9  - Water vapour (60m)
    - B10   # 10 - SWIR Cirrus (60m)
    - B11   # 11 - SWIR 1 (20m)
    - B12   # 12 - SWIR 2 (20m)

  # Preprocessing
  normalization: zscore  # (pixel - mean) / std, per-band

  # Inference
  threshold: 0.60        # Optimal threshold from test-set sweep (Dice 0.899)

  # Metadata
  version: "2.0.0"
  released: "2026-06-03"
  test_dice: 0.899       # At threshold 0.60 — full 6,729-chip test set
  test_iou: 0.8165
  test_precision: 0.909
  test_recall: 0.889
  training_chips: 26940  # Round-3 with hard-negative harvest
  training_loss: focal_dice
